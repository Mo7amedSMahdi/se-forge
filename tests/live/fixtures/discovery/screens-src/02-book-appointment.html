<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Noto Sans Arabic",Arial,sans-serif;background:#F5F7FA;color:#1F2933}
header{background:#0F766E;color:#fff;padding:16px 24px;font-size:20px;font-weight:600}
main{padding:24px;max-width:720px}h1{font-size:24px;margin:0 0 16px}
label{display:block;font-size:14px;color:#52606D;margin:16px 0 8px}
select,input{width:100%;padding:12px;border:1px solid #CBD2D9;border-radius:6px;font-size:16px;background:#fff;box-sizing:border-box}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.slot{border:1px solid #0F766E;color:#0F766E;border-radius:6px;padding:8px 12px;font-size:14px}
.slot.sel{background:#0F766E;color:#fff}.slot.off{border-color:#E4E7EB;color:#9AA5B1}
.primary{margin-top:24px;background:#0F766E;color:#fff;border:0;border-radius:6px;padding:12px 24px;font-size:16px}
</style></head><body><header>عيادة الشفاء</header><main><h1>حجز موعد</h1>
<label>الطبيب</label><select><option>د. سارة خليل — طب عام</option></select>
<label>اليوم</label><input value="12/10/2026">
<label>الأوقات المتاحة</label><div class="slots"><span class="slot">09:00</span><span class="slot sel">09:20</span><span class="slot off">09:40</span><span class="slot">10:00</span></div>
<button class="primary">تأكيد الحجز</button></main></body></html>
