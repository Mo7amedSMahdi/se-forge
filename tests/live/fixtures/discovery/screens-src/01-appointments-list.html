<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Noto Sans Arabic",Arial,sans-serif;background:#F5F7FA;color:#1F2933}
header{background:#0F766E;color:#fff;padding:16px 24px;font-size:20px;font-weight:600}
main{padding:24px;max-width:720px}

.time{font-weight:600;font-size:16px}.doc{color:#52606D;font-size:14px}
.btn{background:#fff;color:#B42318;border:1px solid #B42318;border-radius:6px;padding:8px 16px;font-size:14px}
.primary{background:#0F766E;color:#fff;border:0;border-radius:6px;padding:12px 24px;font-size:16px}
</style></head><body><header>عيادة الشفاء</header><main><h1>مواعيدي القادمة</h1>

<div class="card"><div><div class="time">الثلاثاء 14/10/2026 — 11:00</div><div class="doc">د. عمر حداد — أطفال</div></div><button class="btn">إلغاء</button></div>
<button class="primary">حجز موعد جديد</button></main></body></html>
