# Local development (decisions 71, 72): `docker compose up -d --wait`, then http://localhost:8080.
# The API reloads on every saved change. Tests and the gate run inside the api container:
#   docker compose run --rm -T --no-deps api sh -c '<gate>'
# Values here are for local development only; .env (git-ignored, see .env.example) overrides them.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      target: dev
    command: sh -c "uv run --frozen alembic upgrade head && exec uv run --frozen uvicorn app.main:app --reload --host 0.0.0.0 --port 8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@db:5432/app}
      # Testcontainers start sibling containers through the socket and reach them on the host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - venv:/opt/venv
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # Healthy once the API answers: `up --wait` and dependants wait for it. Probes every second while it
    # starts, then every 30 s (the dev log stays quiet).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=4)"]
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  # Load tests (decision 77, skill load-test): `docker compose --profile perf run --rm k6`, against the
  # running API. The summary prints the thresholds; a failed one fails the run.
  k6:
    profiles: ["perf"]
    image: grafana/k6:2.3.0
    command: ["run", "/perf/users.js"]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./perf:/perf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  venv:
