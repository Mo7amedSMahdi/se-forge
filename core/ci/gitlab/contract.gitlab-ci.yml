# Contract check for the repo that owns the API spec (decisions 28-32): lint, breaking changes against
# the newest approved api-v tag, and the version rule; on an api-v tag, the tag must equal info.version.
# Copy core/ci/contract-check.sh to ci/contract-check.sh, include this file next to checks.gitlab-ci.yml
# (it uses the "check" stage), set SPEC to project.api.spec, and make the job required like the others.
contract:
  stage: check
  image: node:22-bookworm
  variables:
    SPEC: api/openapi.yaml
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [api/**/*]
    - if: $CI_COMMIT_TAG =~ /^api-v/
  script:
    - sh ci/contract-check.sh "$SPEC"
